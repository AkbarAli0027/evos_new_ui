stages:
  - build
  - push
  - deploy

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/evos
  DOCKER_IMAGE_TAG: $CI_PIPELINE_IID
  DOCKER_TLS_CERTDIR: ""


build_image:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      command: ["--host=tcp://0.0.0.0:2375"]
  # privileged: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - BRANCH_SLUG="$CI_COMMIT_REF_SLUG"
    - docker build -t $DOCKER_IMAGE_NAME:${BRANCH_SLUG}-$DOCKER_IMAGE_TAG .
    - docker push $DOCKER_IMAGE_NAME:${BRANCH_SLUG}-$DOCKER_IMAGE_TAG


push_latest_tag:
  stage: push
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - BRANCH_SLUG="$CI_COMMIT_REF_SLUG"
    - docker pull $DOCKER_IMAGE_NAME:${BRANCH_SLUG}-$DOCKER_IMAGE_TAG
    - docker tag  $DOCKER_IMAGE_NAME:${BRANCH_SLUG}-$DOCKER_IMAGE_TAG $DOCKER_IMAGE_NAME:${BRANCH_SLUG}-latest
    - docker push $DOCKER_IMAGE_NAME:${BRANCH_SLUG}-latest
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag  $DOCKER_IMAGE_NAME:${BRANCH_SLUG}-$DOCKER_IMAGE_TAG $DOCKER_IMAGE_NAME:latest
        docker push $DOCKER_IMAGE_NAME:latest
      fi
  only:
    - master
  dependencies:
    - build_image

deploy_to_server:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - |
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        set -e
        cd /home/ubuntu/evos/
        docker login src.ectn.uz:5050 -u root -p 5DmTRD1mkLAtyVpeHaWUp
        docker compose pull
        docker compose down
        docker compose up -d --force-recreate
      "
  environment:
    name: $CI_COMMIT_REF_NAME
    url: http://$SSH_HOST/$CI_COMMIT_REF_NAME
  only:
    - master
  dependencies:
    - push_latest_tag
